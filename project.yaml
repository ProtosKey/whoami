category: other
status: active
name: bio-page

description: >
  Личный сайт-портфолио в терминальном стиле на React. Весь контент
  (профиль, навыки, список проектов) подгружается в рантайме из статических
  YAML/JSON, без пересборки сайта при изменении данных. Есть возможность
  переконфигурации под задачи пользователя.

stack:
  - react
  - js-yaml
  - css
  - nginx

possibilities:
  - 'Все экраны стилизованы под терминал: whoami -l, ls, cat, stat вместо обычных страниц.'
  - 'Категории и навигация строятся полностью из project.json: bio-script сам собирает его из GitHub по всем репозиториям с валидным project.yaml.'
  - 'Профиль и скиллы читаются из whoami.yaml/skills.yaml во время выполнения: формат полностью кастомный, правится напрямую на сервере без пересборки React'
  - "Задеплоен на собственный VPS — nginx, HTTPS через Let's Encrypt с автопродлением."
